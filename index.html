    <script>
        const themeSelect = document.getElementById('themeSelect');

            location.reload();
        });

        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');
            });
        });

        const donateBtn = document.getElementById('donateBtn');
        const donateModal = document.getElementById('donateModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const closeModalOk = document.getElementById('closeModalOk');

        function openDonate() {
            donateModal.style.display = 'block';

        function closeDonate() {
            donateModal.style.display = 'none';
        }
        donateBtn.addEventListener('click', openDonate);
        closeModalBtn.addEventListener('click', closeDonate);
        closeModalOk.addEventListener('click', closeDonate);

        const modalWindow = document.querySelector('.modal-window');
        const modalTitleBar = document.getElementById('modalTitleBar');
        let isDragging = false;
        let dragOffsetX, dragOffsetY;

        modalTitleBar.addEventListener('mousedown', (e) => {
            isDragging = true;
            const rect = modalWindow.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
            modalWindow.style.transform = 'none';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            modalWindow.style.left = e.clientX - dragOffsetX + 'px';
            modalWindow.style.top = e.clientY - dragOffsetY + 'px';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const input = e.target.closest('.address-row').querySelector('input');
                const text = input.value;
                try {
                    await navigator.clipboard.writeText(text);
                    btn.textContent = 'Copied!';
                    setTimeout(() => btn.textContent = 'Copy', 1500);
                } catch (err) {
                    input.select();
                    document.execCommand('copy');
                    btn.textContent = 'Copied!';
                    setTimeout(() => btn.textContent = 'Copy', 1500);
                }
            });
        });

        const alertModal = document.getElementById('alertModal');
        const alertText = document.getElementById('alertText');
        const closeAlertBtn = document.getElementById('closeAlertBtn');
        const closeAlertOk = document.getElementById('closeAlertOk');

        function showAlert(message) {
            alertText.textContent = message;
            alertModal.style.display = 'block';
        }
        function closeAlert() {
            alertModal.style.display = 'none';
        }
        closeAlertBtn.addEventListener('click', closeAlert);
        closeAlertOk.addEventListener('click', closeAlert);

        function getImageDataFromCanvas(canvas) {
            const ctx = canvas.getContext('2d');
            return ctx.getImageData(0, 0, canvas.width, canvas.height);
        }

        function putImageDataToCanvas(canvas, imageData) {
            const ctx = canvas.getContext('2d');
            ctx.putImageData(imageData, 0, 0);
        }

        function stringToBytes(str) {
            return new TextEncoder().encode(str);
        }

        function bytesToString(bytes) {
            return new TextDecoder().decode(bytes);
        }

        function embedData(imageData, bytes) {
            const data = imageData.data;
            const capacity = (data.length / 4) * 3;
            const required = 32 + bytes.length * 8;
            if (required > capacity) {
                throw new Error('Image too small to hold the code');
            }
            const bitArray = [];
            for (let i = 0; i < 32; i++) {
                bitArray.push((bytes.length >>> i) & 1);
            }
            for (let byte of bytes) {
                for (let i = 0; i < 8; i++) {
                    bitArray.push((byte >>> i) & 1);
                }
            }
            let bitIndex = 0;
            for (let i = 0; i < data.length; i += 4) {
                if (bitIndex >= bitArray.length) break;
                for (let channel = 0; channel < 3; channel++) {
                    if (bitIndex >= bitArray.length) break;
                    data[i + channel] = (data[i + channel] & 0xFE) | bitArray[bitIndex];
                    bitIndex++;
                }
            }
        }

        function extractData(imageData) {
            const data = imageData.data;
            const bitArray = [];
            for (let i = 0; i < data.length; i += 4) {
                for (let channel = 0; channel < 3; channel++) {
                    if (bitArray.length < 32 + 8 * 1024 * 1024) {
                        bitArray.push(data[i + channel] & 1);
                    } else {
                        break;
                    }
                }
            }
            let length = 0;
            for (let i = 0; i < 32; i++) {
                if (bitArray[i]) length |= (1 << i);
            }
            if (length <= 0 || length > 1024 * 1024) return null;
            const bytes = new Uint8Array(length);
            let byteIndex = 0;
            let currentByte = 0;
            let bitCount = 0;
            for (let i = 32; i < 32 + length * 8; i++) {
                if (bitArray[i]) currentByte |= (1 << bitCount);
                bitCount++;
                if (bitCount === 8) {
                    bytes[byteIndex] = currentByte;
                    byteIndex++;
                    currentByte = 0;
                    bitCount = 0;
                }
            }
            return bytesToString(bytes);
        }

        function generateDefaultCover(width, height) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#000080');
            gradient.addColorStop(1, '#008080');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 30px Tahoma';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('SQL STEGO', width/2, height/2);
            return canvas;
        }

        const encodeBtn = document.getElementById('encodeBtn');
        const createEncodeBtn = document.getElementById('createEncodeBtn');
        const coverImage = document.getElementById('coverImage');
        const encodeDropZone = document.getElementById('encodeDropZone');
        const encodePreview = document.getElementById('encodePreview');
        const clearEncode = document.getElementById('clearEncode');
        let selectedCoverFile = null;

        encodeDropZone.addEventListener('click', () => coverImage.click());
        encodeDropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            encodeDropZone.classList.add('dragover');
        });
        encodeDropZone.addEventListener('dragleave', () => encodeDropZone.classList.remove('dragover'));
        encodeDropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            encodeDropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                selectedCoverFile = e.dataTransfer.files[0];
                showCoverPreview(selectedCoverFile);
            }
        });
        coverImage.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedCoverFile = e.target.files[0];
                showCoverPreview(selectedCoverFile);
            }
        });

        function showCoverPreview(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                encodePreview.src = e.target.result;
                encodePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        clearEncode.addEventListener('click', () => {
            document.getElementById('sqlInput').value = '';
            selectedCoverFile = null;
            encodePreview.style.display = 'none';
            encodePreview.src = '';
            coverImage.value = '';
            document.getElementById('encodeOutput').innerHTML = '';
        });

        createEncodeBtn.addEventListener('click', () => {
            const sqlCode = document.getElementById('sqlInput').value.trim();
            if (!sqlCode) {
                showAlert('Please enter SQL code first');
                return;
            }
            const canvas = generateDefaultCover(600, 400);
            const dataUrl = canvas.toDataURL('image/png');
            const outputDiv = document.getElementById('encodeOutput');
            outputDiv.innerHTML = `
                <img src="${dataUrl}" alt="Created image">
                <br>
                <a href="${dataUrl}" download="created.png" class="btn">Download Image</a>
            `;
        });

        encodeBtn.addEventListener('click', async () => {
            const sqlCode = document.getElementById('sqlInput').value.trim();
            if (!sqlCode) {
                showAlert('Please enter SQL code first');
                return;
            }
            let coverCanvas = null;
            if (selectedCoverFile) {
                const img = new Image();
                img.src = URL.createObjectURL(selectedCoverFile);
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                });
                coverCanvas = document.createElement('canvas');
                coverCanvas.width = img.width;
                coverCanvas.height = img.height;
                coverCanvas.getContext('2d').drawImage(img, 0, 0);
                URL.revokeObjectURL(img.src);
            } else {
                coverCanvas = generateDefaultCover(600, 400);
            }
            const ctx = coverCanvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, coverCanvas.width, coverCanvas.height);
            const bytes = stringToBytes(sqlCode);
            try {
                embedData(imageData, bytes);
                ctx.putImageData(imageData, 0, 0);
                const dataUrl = coverCanvas.toDataURL('image/png');
                const outputDiv = document.getElementById('encodeOutput');
                outputDiv.innerHTML = `
                    <img src="${dataUrl}" alt="Encoded image">
                    <br>
                    <a href="${dataUrl}" download="encoded.png" class="btn">Download Image</a>
                `;
            } catch (err) {
                showAlert(err.message);
            }
        });

        const dropZone = document.getElementById('dropZone');
        const decodeFile = document.getElementById('decodeFile');
        const decodeBtn = document.getElementById('decodeBtn');
        const decodeSqlBtn = document.getElementById('decodeSqlBtn');
        const createDecodeBtn = document.getElementById('createDecodeBtn');
        const decodedOutput = document.getElementById('decodedOutput');
        const decodePreview = document.getElementById('decodePreview');
        const clearDecode = document.getElementById('clearDecode');

        let currentImageData = null;
        let currentImageBase64 = null;

        dropZone.addEventListener('click', () => decodeFile.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                loadImage(e.dataTransfer.files[0]);
            }
        });
        decodeFile.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                loadImage(e.target.files[0]);
            }
        });

        async function loadImage(file) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                currentImageBase64 = e.target.result;
                const img = new Image();
                img.src = e.target.result;
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                });
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                decodePreview.src = e.target.result;
                decodePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        clearDecode.addEventListener('click', () => {
            currentImageData = null;
            currentImageBase64 = null;
            decodePreview.style.display = 'none';
            decodePreview.src = '';
            decodeFile.value = '';
            decodedOutput.value = '';
        });

        createDecodeBtn.addEventListener('click', () => {
            if (!currentImageData) {
                showAlert('Please select an image first');
                return;
            }
            const canvas = document.createElement('canvas');
            canvas.width = currentImageData.width;
            canvas.height = currentImageData.height;
            const ctx = canvas.getContext('2d');
            ctx.putImageData(currentImageData, 0, 0);
            const dataUrl = canvas.toDataURL('image/png');
            decodedOutput.value = dataUrl;
        });

        decodeBtn.addEventListener('click', () => {
            if (!currentImageBase64) {
                showAlert('Please select an image first');
                return;
            }
            const base64 = currentImageBase64.split(',')[1];
            decodedOutput.value = base64;
        });

        decodeSqlBtn.addEventListener('click', () => {
            if (!currentImageData) {
                showAlert('Please select an image first');
                return;
            }
            const extracted = extractData(currentImageData);
            decodedOutput.value = extracted || 'No hidden code found or image not encoded by this tool.';
        });
    </script>
</body>
</html>
